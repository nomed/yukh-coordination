name: Go

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository structure
        run: .github/scripts/check-repository-structure.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install qualification NATS server
        run: go install github.com/nats-io/nats-server/v2@v2.12.0
      - name: Run race and JetStream qualification tests
        run: YUKH_NATS_SERVER="$(go env GOPATH)/bin/nats-server" go test -race ./...
